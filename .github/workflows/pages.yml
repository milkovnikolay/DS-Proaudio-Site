# Превью сайта на GitHub Pages: при каждом изменении в main папка site/ публикуется заново.
# Все страницы закрываются паролем из секрета SITE_PASSWORD (без секрета публикация не выполняется).
name: Превью сайта (GitHub Pages)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Стартовая страница
        run: |
          touch site/.nojekyll
          [ -f site/index.html ] || cp site/Main.dc.html site/index.html
      - name: Пароль на вход
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: node tools/protect.mjs site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
